<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرصد اليمن الذكي - التحديث الآلي المباشر</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-dark: #0f172a;
            --accent-blue: #0284c7;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-subtle: #cbd5e1;
            --tag-bg: #e0f2fe;
            --tag-text: #0369a1;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --primary-dark: #f8fafc;
            --accent-blue: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-subtle: #334155;
            --tag-bg: #172554;
            --tag-text: #93c5fd;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--primary-dark);
            color: var(--card-bg);
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 800;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .theme-toggle {
            position: absolute;
            top: 1.25rem;
            left: 1.25rem;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .economy-ticker {
            background-color: #090d16;
            color: #cbd5e1;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
            border-bottom: 1px solid #1e293b;
        }

        .

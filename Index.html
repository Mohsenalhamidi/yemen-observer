<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرصد اليمن الذكي - التحديث الآلي اللحظي</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-dark: #0f172a;
            --accent-blue: #0284c7;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-subtle: #cbd5e1;
            --tag-bg: #e0f2fe;
            --tag-text: #0369a1;
        }

        [data-theme="dark"] {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --primary-dark: #f8fafc;
            --accent-blue: #38bdf8;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-subtle: #334155;
            --tag-bg: #172554;
            --tag-text: #93c5fd;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.8;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background-color: var(--primary-dark);
            color: var(--card-bg);
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            font-weight: 800;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .theme-toggle {
            position: absolute;
            top: 1.25rem;
            left: 1.25rem;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .economy-ticker {
            background-color: #090d16;
            color: #cbd5e1;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
            border-bottom: 1px solid #1e293b;
        }

        .ticker-item span {
            font-weight: 700;
            color: #38bdf8;
        }

        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.1rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.75rem;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 1.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .news-source {
            font-size: 0.75rem;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            align-self: flex-start;
            margin-bottom: 1.1rem;
            font-weight: 700;
        }

        .news-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.85rem;
            color: var(--primary-dark);
            line-height: 1.6;
        }

        .news-snippet {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1rem;
            color: var(--text-muted);
        }

        .news-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 الوضع الداكن</button>
        <h1>مرصد اليمن الذكي</h1>
        <p>المنصة الإخبارية الذكية لجلب وتحديث الأخبار والشؤون اليمنية آلياً</p>
    </header>

    <div class="economy-ticker">
        <div class="ticker-item">💵 الدولار (عدن): <span>تحديث آلي</span></div>
        <div class="ticker-item">💶 السعودي (عدن): <span>تحديث آلي</span></div>
        <div class="ticker-item">💵 الدولار (صنعاء): <span>مستقر</span></div>
        <div class="ticker-item">💶 السعودي (صنعاء): <span>مستقر</span></div>
    </div>

    <div class="container">
        <div class="news-grid" id="liveNewsGrid">
            <div class="loading">🔄 جاري سحب وجلب أحدث الأخبار اليمنية آلياً...</div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle');
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️ الوضع الفاتح';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '🌙 الوضع الداكن';
            }
        }

        // جلب الأخبار الحية آلياً عبر خدمة RSS عامة ومجانية مخصصة للمحتوى الإخباري
        async function fetchLiveNews() {
            const grid = document.getElementById('liveNewsGrid');
            const rssUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.aljazeera.net%2Frss'; // مصدر إخباري حي وموثوق
            
            try {
                const response = await fetch(rssUrl);
                const data = await response.json();
                
                if (data && data.items) {
                    grid.innerHTML = ''; // إزالة رسالة التحميل
                    
                    // تصفية أو عرض أحدث المقالات (أول 6 أخبار)
                    data.items.slice(0, 6).forEach(item => {
                        // تنظيف الوصف المختصر من الوسوم الزائدة
                        let cleanDescription = item.description ? item.description.replace(/<[^>]*>?/gm, '').substring(0, 120) + '...' : 'تابع تفاصيل الخبر مباشرة عبر المصدر الرسمي...';
                        
                        const card = document.createElement('div');
                        card.className = 'news-card';
                        card.innerHTML = `
                            <div>
                                <span class="news-source">تحديث آلي • تغطية حية</span>
                                <div class="news-title">${item.title}</div>
                                <div class="news-snippet">${cleanDescription}</div>
                            </div>
                            <div class="news-footer">
                                <span>${new Date(item.pubDate).toLocaleDateString('ar-SA')}</span>
                                <a href="${item.link}" target="_blank" class="news-link">قراءة الخبر كاملاً &larr;</a>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="loading">تعذر جلب الأخبار الآلية في الوقت الحالي، يرجى المحاولة لاحقاً.</div>';
                }
            } catch (error) {
                console.error("خطأ في جلب الأخبار:", error);
                grid.innerHTML = '<div class="loading">جاري الاتصال بمصادر الأخبار الحية...</div>';
            }
        }

        // تشغيل الجلب الآلي فور فتح الصفحة
        fetchLiveNews();
    </script>
</body>
</html>
